<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Эфирные помощники</title>
    <meta name="description" content="Эфирные помощники: светлый расклад, магические кубики и кристальная рулетка." />

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS (для расклада и рулетки) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React и ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- html2canvas (для расклада) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- canvas-confetti (для рулетки) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Babel standalone для JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* ===== Глобальные сбросы ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* ===== Глобальные стили (общие для всех страниц) ===== */
        .glass {
            background: rgba(255, 255, 255, 0.34);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.48);
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.12);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.44);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.58);
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.14);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #fce4ec, #f3e5f5, #ede7f6, #e8eaf6, #e3f2fd, #e0f7fa, #e0f2f1, #f1f8e9);
        }

        /* ===== Главная страница (home) ===== */
        #home {
            color: #334155;
            background:
                radial-gradient(circle at 14% 18%, rgba(252, 231, 243, .9), transparent 32%),
                radial-gradient(circle at 83% 14%, rgba(224, 242, 254, .85), transparent 34%),
                radial-gradient(circle at 80% 82%, rgba(237, 233, 254, .8), transparent 35%),
                linear-gradient(135deg, #fce4ec 0%, #f3e5f5 34%, #e8eaf6 66%, #e0f7fa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
            padding: 40px 16px;
        }

        #home .blob {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            pointer-events: none;
            animation: breathe 7s ease-in-out infinite;
        }
        #home .blob-1 {
            top: -96px;
            right: -112px;
            width: 320px;
            height: 320px;
            background: rgba(244, 168, 212, .35);
        }
        #home .blob-2 {
            bottom: -112px;
            left: -96px;
            width: 320px;
            height: 320px;
            background: rgba(196, 181, 253, .30);
            animation-delay: 1.3s;
        }
        #home .blob-3 {
            top: 50%;
            right: 32px;
            width: 224px;
            height: 224px;
            background: rgba(103, 232, 249, .25);
            animation-delay: 2.2s;
        }

        @keyframes breathe {
            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: .55;
            }
            50% {
                transform: translate3d(0, -10px, 0) scale(1.04);
                opacity: .8;
            }
        }

        #home .sparkle {
            position: absolute;
            pointer-events: none;
            color: rgba(253, 224, 71, .8);
            animation: twinkle 3.8s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%,
            100% {
                transform: scale(.72) rotate(0deg);
                opacity: .2;
            }
            50% {
                transform: scale(1) rotate(18deg);
                opacity: .65;
            }
        }

        #home .content {
            position: relative;
            z-index: 10;
            margin: 0 auto;
            max-width: 26rem;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            text-align: center;
        }

        #home .soft-glass {
            background: rgba(255, 255, 255, .46);
            border: 1px solid rgba(255, 255, 255, .62);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 14px 36px rgba(124, 58, 237, .1);
        }

        #home .badge {
            border-radius: 9999px;
            padding: 6px 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .22em;
            color: rgba(168, 85, 247, .8);
        }

        #home .title {
            font-size: clamp(2.25rem, 9vw, 3rem);
            font-weight: 700;
            line-height: .95;
            letter-spacing: -0.02em;
            color: #334155;
        }

        #home .subtitle {
            max-width: 20rem;
            font-size: clamp(.875rem, 4vw, 1rem);
            line-height: 1.5;
            color: rgba(100, 116, 139, .8);
        }

        #home .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #home .link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 80px;
            width: 100%;
            padding: 0 20px;
            border-radius: 16px;
            text-align: left;
            text-decoration: none;
            overflow: hidden;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
            background:
                linear-gradient(110deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .42)) padding-box,
                linear-gradient(110deg, #f9a8d4, #c4b5fd, #93c5fd, #67e8f9, #fde68a) border-box;
            border: 1px solid transparent;
        }
        #home .link::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 15px;
            background: linear-gradient(100deg, rgba(249, 168, 212, .16), rgba(196, 181, 253, .18), rgba(103, 232, 249, .14));
            pointer-events: none;
        }
        #home .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 40px rgba(196, 181, 253, .35);
        }
        #home .link:active {
            transform: translateY(0) scale(.99);
        }

        #home .link-icon {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            width: 48px;
            flex-shrink: 0;
            border-radius: 16px;
            transition: transform .3s ease;
        }
        #home .link:hover .link-icon {
            transform: scale(1.05);
        }
        #home .link-icon svg {
            height: 24px;
            width: 24px;
        }

        #home .link-text {
            position: relative;
            z-index: 1;
            flex: 1;
        }
        #home .link-label {
            display: block;
            font-size: clamp(1rem, 4.5vw, 1.125rem);
            font-weight: 600;
            color: #334155;
        }
        #home .link-hint {
            display: block;
            font-size: 12px;
            color: #94a3b8;
        }

        #home .link-arrow {
            position: relative;
            z-index: 1;
            height: 20px;
            width: 20px;
            color: #cbd5e1;
            transition: transform .3s ease, color .3s ease;
        }
        #home .link:hover .link-arrow {
            transform: translateX(4px);
            color: #64748b;
        }

        #home .footer {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .24em;
            color: rgba(203, 213, 225, .8);
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #home .rise {
            opacity: 0;
            animation: riseIn .7s ease forwards;
        }
        #home .d1 {
            animation-delay: .08s;
        }
        #home .d2 {
            animation-delay: .16s;
        }
        #home .d3 {
            animation-delay: .24s;
        }
        #home .d4 {
            animation-delay: .36s;
        }

        /* ===== Стили для кубиков (изолированы через #dice-app) ===== */
        #dice-app {
            /* общие переменные */
            --bg: #faf6ef;
            --bg-soft: #f3ede1;
            --ink: #2d2a44;
            --ink-soft: #6b6680;
            --accent: #7c6ad1;
            --accent-deep: #5b4bb0;
            --border: #e8dfd1;
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
            --sal: env(safe-area-inset-left);
            --sar: env(safe-area-inset-right);
        }

        @property --frx {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }
        @property --fry {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }

        #dice-app * {
            box-sizing: border-box;
        }

        #dice-app {
            font-family: "Inter", system-ui, sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 20% 10%, rgba(124, 106, 209, 0.06), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(210, 170, 120, 0.08), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6), transparent 60%);
            min-height: 100vh;
            padding-top: var(--sat);
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }

        #dice-app button {
            font-family: inherit;
            cursor: pointer;
            touch-action: manipulation;
            border: none;
            background: none;
            color: inherit;
        }
        #dice-app button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        @media (hover: none) and (pointer: coarse) {
            #dice-app button:active {
                opacity: 0.8;
            }
        }

        #dice-app .font-display {
            font-family: "Cormorant Garamond", "Georgia", serif;
            letter-spacing: 0.01em;
        }

        #dice-app .wrap {
            max-width: 768px;
            margin: 0 auto;
            padding: 1.5rem 1rem 1.5rem;
        }
        @media (min-width: 640px) {
            #dice-app .wrap {
                padding: 2.5rem 1.5rem;
            }
        }

        #dice-app header {
            margin-bottom: 1.5rem;
        }
        @media (min-width: 640px) {
            #dice-app header {
                margin-bottom: 2.5rem;
            }
        }

        #dice-app .field {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            padding: 2rem 1rem;
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            box-shadow: 0 16px 48px -24px rgba(91, 75, 176, 0.3);
            overflow: hidden;
        }
        @media (min-width: 640px) {
            #dice-app .field {
                min-height: 260px;
                padding: 2.5rem 1.5rem;
                border-radius: 1.75rem;
            }
        }
        #dice-app .field::before,
        #dice-app .field::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(40px);
        }
        #dice-app .field::before {
            left: 1rem;
            top: 1rem;
            width: 4rem;
            height: 4rem;
            background: rgba(124, 106, 209, 0.05);
        }
        #dice-app .field::after {
            right: 1.5rem;
            bottom: 1rem;
            width: 5rem;
            height: 5rem;
            background: rgba(210, 170, 120, 0.1);
        }
        @media (min-width: 640px) {
            #dice-app .field::before {
                width: 6rem;
                height: 6rem;
            }
            #dice-app .field::after {
                width: 8rem;
                height: 8rem;
            }
        }

        #dice-app .sum-badge {
            position: absolute;
            right: 0.75rem;
            top: 0.75rem;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 999px;
            padding: 0.25rem 0.625rem;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }
        @media (min-width: 640px) {
            #dice-app .sum-badge {
                right: 1.25rem;
                top: 1.25rem;
                padding: 0.25rem 0.75rem;
                font-size: 12px;
            }
        }
        #dice-app .sum-badge b {
            color: var(--ink);
            font-weight: 600;
        }

        #dice-app .dice-grid {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
        }
        @media (min-width: 640px) {
            #dice-app .dice-grid {
                gap: 2.5rem;
            }
        }

        #dice-app .die {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #dice-app .die-scene {
            perspective: 500px;
        }
        #dice-app .die-preserve-3d {
            transform-style: preserve-3d;
        }

        #dice-app .cube {
            transform-style: preserve-3d;
            position: relative;
        }
        #dice-app .cube-face {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 16%;
            backface-visibility: hidden;
            border-radius: 16%;
            border: 1.5px solid #ddd5c4;
        }
        #dice-app .cube-face--top {
            background: linear-gradient(135deg, #fffdf7, #f5f0e6);
        }
        #dice-app .cube-face--front {
            background: linear-gradient(135deg, #f8f3e9, #f0eadc);
        }
        #dice-app .cube-face--back {
            background: linear-gradient(135deg, #eee8da, #e6dfd1);
        }
        #dice-app .cube-face--right {
            background: linear-gradient(135deg, #f2ece0, #ebe4d6);
        }
        #dice-app .cube-face--left {
            background: linear-gradient(135deg, #f0eadc, #e9e2d4);
        }
        #dice-app .cube-face--bottom {
            background: linear-gradient(135deg, #eae4d6, #e2dbc9);
        }
        #dice-app .cube-face::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.5),
                inset 0 -1px 2px rgba(0, 0, 0, 0.04);
            pointer-events: none;
        }
        #dice-app .cube-face--front {
            transform: translateZ(calc(var(--hs)));
        }
        #dice-app .cube-face--back {
            transform: rotateY(180deg) translateZ(calc(var(--hs)));
        }
        #dice-app .cube-face--right {
            transform: rotateY(90deg) translateZ(calc(var(--hs)));
        }
        #dice-app .cube-face--left {
            transform: rotateY(-90deg) translateZ(calc(var(--hs)));
        }
        #dice-app .cube-face--top {
            transform: rotateX(-90deg) translateZ(calc(var(--hs)));
        }
        #dice-app .cube-face--bottom {
            transform: rotateX(90deg) translateZ(calc(var(--hs)));
        }

        #dice-app .cube-dot {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #dice-app .cube-dot.active::after {
            content: "";
            display: block;
            width: 78%;
            height: 78%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 38%, #443f5c, #2d2a44);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        #dice-app .flat-face {
            background: linear-gradient(135deg, #fffdf7, #f5f0e6);
            border: 1.5px solid #ddd5c4;
            border-radius: 16%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 16%;
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.5),
                inset 0 -1px 2px rgba(0, 0, 0, 0.04),
                0 10px 18px rgba(79, 70, 229, 0.15);
            transform-style: flat;
        }

        #dice-app .ground-shadow {
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(45, 42, 68, 0.18) 0%, transparent 70%);
        }

        /* Анимации кубиков */
        @keyframes diceThrow {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            3% {
                transform: translate3d(calc(var(--dir, 1) * -3px), 3px, 0) scale(0.96);
            }
            7% {
                transform: translate3d(calc(var(--dir, 1) * 6px), -50px, 0) scale(1.06);
            }
            11% {
                transform: translate3d(calc(var(--dir, 1) * 11px), -80px, 0) scale(1.1);
            }
            15% {
                transform: translate3d(calc(var(--dir, 1) * 14px), -62px, 0) scale(1.07);
            }
            19% {
                transform: translate3d(calc(var(--dir, 1) * 14px), -18px, 0) scale(1.02);
            }
            22% {
                transform: translate3d(calc(var(--dir, 1) * 14px), 4px, 0) scale(0.96);
            }
            26% {
                transform: translate3d(calc(var(--dir, 1) * 12px), -38px, 0) scale(1.05);
            }
            30% {
                transform: translate3d(calc(var(--dir, 1) * 9px), -24px, 0) scale(1.02);
            }
            34% {
                transform: translate3d(calc(var(--dir, 1) * 6px), -6px, 0) scale(1);
            }
            37% {
                transform: translate3d(calc(var(--dir, 1) * 5px), 4px, 0) scale(0.98);
            }
            40% {
                transform: translate3d(calc(var(--dir, 1) * 3px), -18px, 0) scale(1.02);
            }
            44% {
                transform: translate3d(calc(var(--dir, 1) * 1px), -20px, 0) scale(1.03);
            }
            48% {
                transform: translate3d(calc(var(--dir, 1) * -1px), -6px, 0) scale(1);
            }
            51% {
                transform: translate3d(calc(var(--dir, 1) * -2px), 3px, 0) scale(0.99);
            }
            55% {
                transform: translate3d(calc(var(--dir, 1) * -2px), -10px, 0) scale(1.01);
            }
            59% {
                transform: translate3d(calc(var(--dir, 1) * -1px), -4px, 0) scale(1);
            }
            63% {
                transform: translate3d(0, 2px, 0) scale(1);
            }
            67% {
                transform: translate3d(0, -3px, 0) scale(1);
            }
            70% {
                transform: translate3d(0, -1px, 0) scale(1);
            }
            75% {
                transform: translate3d(0, 1px, 0) scale(1);
            }
            80% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            100% {
                transform: translate3d(0, 0, 0) scale(1);
            }
        }

        @keyframes diceSpin {
            0% {
                transform: rotateX(0) rotateY(0) rotateZ(0);
            }
            10% {
                transform: rotateX(-520deg) rotateY(360deg) rotateZ(-220deg);
            }
            20% {
                transform: rotateX(-1080deg) rotateY(760deg) rotateZ(-460deg);
            }
            30% {
                transform: rotateX(-1540deg) rotateY(1100deg) rotateZ(-680deg);
            }
            40% {
                transform: rotateX(-1910deg) rotateY(1380deg) rotateZ(-860deg);
            }
            50% {
                transform: rotateX(-2190deg) rotateY(1560deg) rotateZ(-980deg);
            }
            60% {
                transform: rotateX(-2370deg) rotateY(1680deg) rotateZ(-1040deg);
            }
            70% {
                transform: rotateX(-2460deg) rotateY(1740deg) rotateZ(-1066deg);
            }
            80% {
                transform: rotateX(-2500deg) rotateY(1780deg) rotateZ(-1078deg);
            }
            90% {
                transform: rotateX(-2515deg) rotateY(1795deg) rotateZ(-1079deg);
            }
            100% {
                transform: rotateX(-2520deg) rotateY(1800deg) rotateZ(-1080deg);
            }
        }

        @keyframes diceOrient {
            0%,
            84% {
                transform: rotateX(0) rotateY(0);
            }
            100% {
                transform: rotateX(var(--frx)) rotateY(var(--fry));
            }
        }

        @keyframes diceShadow {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            3% {
                transform: scale(0.98);
                opacity: 0.48;
            }
            7% {
                transform: scale(0.5);
                opacity: 0.15;
            }
            11% {
                transform: scale(0.35);
                opacity: 0.1;
            }
            15% {
                transform: scale(0.45);
                opacity: 0.14;
            }
            19% {
                transform: scale(0.6);
                opacity: 0.28;
            }
            22% {
                transform: scale(0.92);
                opacity: 0.48;
            }
            26% {
                transform: scale(0.5);
                opacity: 0.16;
            }
            30% {
                transform: scale(0.6);
                opacity: 0.24;
            }
            34% {
                transform: scale(0.78);
                opacity: 0.36;
            }
            37% {
                transform: scale(0.9);
                opacity: 0.44;
            }
            40% {
                transform: scale(0.68);
                opacity: 0.28;
            }
            44% {
                transform: scale(0.58);
                opacity: 0.2;
            }
            48% {
                transform: scale(0.8);
                opacity: 0.36;
            }
            51% {
                transform: scale(0.88);
                opacity: 0.42;
            }
            55% {

    <script>
        // ===== Инициализация Telegram (один раз) =====
        (function() {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                try {
                    tg.setHeaderColor("#f3e5f5");
                    tg.setBackgroundColor("#fce4ec");
                } catch (e) {}
            }
            window._tg = tg; // сохраняем глобально
        })();

        // ===== Функции переключения страниц =====
        var currentPage = 'home';
        var layoutRoot = null;
        var rouletteRoot = null;
        var rpsRoot = null;
        var diceInitialized = false;

        function hideAll() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('layout-app').style.display = 'none';
            document.getElementById('dice-app').style.display = 'none';
            document.getElementById('roulette-app').style.display = 'none';
            document.getElementById('rps-app').style.display = 'none';
        }

        function showPage(page) {
            if (page === currentPage) return;
            hideAll();

            if (page === 'home') {
                document.getElementById('home').style.display = '';
                currentPage = 'home';
                return;
            }

            if (page === 'layout') {
                document.getElementById('layout-app').style.display = '';
                if (!layoutRoot) {
                    var container = document.getElementById('layout-app');
                    layoutRoot = ReactDOM.createRoot(container);
                    // Рендерим компонент LayoutApp (определён ниже в Babel)
                    layoutRoot.render(React.createElement(LayoutApp));
                }
                currentPage = 'layout';
            } else if (page === 'dice') {
                document.getElementById('dice-app').style.display = '';
                if (!diceInitialized) {
                    initDice(document.getElementById('dice-app'));
                    diceInitialized = true;
                }
                currentPage = 'dice';
            } else if (page === 'roulette') {
                document.getElementById('roulette-app').style.display = '';
                if (!rouletteRoot) {
                    var container = document.getElementById('roulette-app');
                    rouletteRoot = ReactDOM.createRoot(container);
                    // Рендерим компонент RouletteApp (определён ниже в Babel)
                    rouletteRoot.render(React.createElement(RouletteApp));
                }
                currentPage = 'roulette';
            } else if (page === 'rps') {
                document.getElementById('rps-app').style.display = '';
                if (!rpsRoot) {
                    var container = document.getElementById('rps-app');
                    rpsRoot = ReactDOM.createRoot(container);
                    // Рендерим компонент RPSApp (определён ниже в Babel)
                    rpsRoot.render(React.createElement(RPSApp));
                }
                currentPage = 'rps';
            }
        }

        // ===== Инициализация кубиков (ванильный JS, изолированный) =====
        function initDice(container) {
            // Все элементы внутри контейнера
            var $ = function(id) { return container.querySelector('#' + id); };

            var fieldEl = $('dice-field');
            var gridEl = $('dice-grid');
            var sumBadge = $('dice-sumBadge');
            var segEl = $('dice-seg');
            var btnRoll = $('dice-btnRoll');
            var btnRollText = $('dice-btnRollText');
            var rollIcon = $('dice-rollIcon');
            var btnSnapshot = $('dice-btnSnapshot');
            var btnSnapshotText = $('dice-btnSnapshotText');
            var historyBody = $('dice-historyBody');
            var historyEmpty = $('dice-historyEmpty');
            var historySub = $('dice-historySub');
            var btnClear = $('dice-btnClear');
            var toastEl = $('dice-toast');
            var toastBox = $('dice-toastBox');
            var modal = $('dice-snapshotModal');
            var modalImg = $('dice-modalImg');
            var modalSaveBtn = $('dice-modalSaveBtn');
            var modalCloseBtn = $('dice-modalCloseBtn');

            // ── State ─────────────────────────────────────────────────────
            var state = {
                count: 1,
                dice: [3],
                rolling: false,
                snapshotting: false,
                snapshotBusy: false,
                history: [],
                counter: 0,
            };
            var ROLL_DURATION = 3000;

            var FACE_TO_FRONT = {
                1: { rx: 0, ry: 0 },
                2: { rx: 0, ry: -90 },
                3: { rx: 90, ry: 0 },
                4: { rx: -90, ry: 0 },
                5: { rx: 0, ry: 90 },
                6: { rx: 0, ry: 180 },
            };
            var FACES = [
                { cls: "front", n: 1 },
                { cls: "back", n: 6 },
                { cls: "right", n: 2 },
                { cls: "left", n: 5 },
                { cls: "top", n: 3 },
                { cls: "bottom", n: 4 },
            ];
            var DOT_MAP = {
                1: [4],
                2: [2, 6],
                3: [2, 4, 6],
                4: [0, 2, 6, 8],
                5: [0, 2, 4, 6, 8],
                6: [0, 2, 3, 5, 6, 8],
            };

            // ── Rendering helpers ─────────────────────────────────────────
            function dieSize() {
                var w = window.innerWidth;
                var h = window.innerHeight;
                if (h < 500) return Math.min(72, Math.floor((h - 120) / state.count));
                if (w < 380) return Math.floor(Math.min((w - 80) / state.count, 85));
                if (w < 640) return Math.floor(Math.min((w - 100) / state.count, 100));
                return 110;
            }

            function faceDotsHTML(n) {
                var active = DOT_MAP[n] || DOT_MAP[1];
                var out = "";
                for (var i = 0; i < 9; i++) {
                    out += '<div class="cube-dot ' + (active.includes(i) ? "active" : "") + '"></div>';
                }
                return out;
            }

            function dieHTML(value, idx, size, rolling, flat) {
                if (flat) {
                    return '<div class="die" style="width:' + size + 'px">' +
                        '<div class="flat-face" style="width:' + size + 'px;height:' + size + 'px">' +
                        faceDotsHTML(value) +
                        '</div>' +
                        '<div class="ground-shadow" style="width:' + (size * 0.55) + 'px;height:' + (size * 0.07) +
                        'px;margin-top:' + (size * 0.08) + 'px"></div>' +
                        '</div>';
                }

                var face = FACE_TO_FRONT[value] || FACE_TO_FRONT[1];
                var rx = face.rx,
                    ry = face.ry;
                var hs = size / 2;
                var dir = idx % 2 === 0 ? 1 : -1;
                var delay = idx * 200;
                var cubeStyle = rolling ?
                    'width:' + size + 'px;height:' + size + 'px;transform:rotateX(0deg) rotateY(0deg)' :
                    'width:' + size + 'px;height:' + size + 'px;transform:rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';

                var facesHTML = "";
                for (var f = 0; f < FACES.length; f++) {
                    var cls = FACES[f].cls;
                    var n = FACES[f].n;
                    facesHTML += '<div class="cube-face cube-face--' + cls + '" style="--hs:' + hs + 'px">' +
                        faceDotsHTML(n) + '</div>';
                }

                return '<div class="die" style="width:' + size + 'px">' +
                    '<div class="die-scene" style="width:' + size + 'px;height:' + size + 'px">' +
                    '<div class="die-preserve-3d ' + (rolling ? "anim-throw" : "") + '" style="' +
                    (rolling ? '--dir:' + dir + ';animation-delay:' + delay + 'ms;' : '') + 'width:' + size +
                    'px;height:' + size + 'px">' +
                    '<div class="die-preserve-3d ' + (rolling ? "anim-spin" : "") + '" style="' +
                    (rolling ? 'animation-delay:' + delay + 'ms;' : '') + '">' +
                    '<div class="die-preserve-3d ' + (rolling ? "anim-orient" : "") + '" style="' +
                    (rolling ? 'animation-delay:' + delay + 'ms;' : '') + 'width:' + size + 'px;height:' + size +
                    'px;--frx:' + rx + 'deg;--fry:' + ry + 'deg">' +
                    '<div class="cube" style="' + cubeStyle + '">' +
                    facesHTML +
                    '</div></div></div></div></div>' +
                    '<div class="ground-shadow ' + (rolling ? "anim-shadow" : "") + '" style="width:' + (size * 0.55) +
                    'px;height:' + (size * 0.07) + 'px;margin-top:' + (-size * 0.03) + 'px;' +
                    (rolling ? 'animation-delay:' + delay + 'ms;' : '') + '"></div>' +
                    '</div>';
            }

            function renderDice() {
                var size = dieSize();
                var html = '';
                for (var i = 0; i < state.dice.length; i++) {
                    html += dieHTML(state.dice[i], i, size, state.rolling, state.snapshotting);
                }
                gridEl.innerHTML = html;
                sumBadge.textContent = state.dice.reduce(function(a, b) { return a + b; }, 0);
            }

            function renderSeg() {
                var btns = segEl.querySelectorAll("button");
                for (var i = 0; i < btns.length; i++) {
                    var b = btns[i];
                    var n = parseInt(b.dataset.count, 10);
                    b.classList.toggle("active", n === state.count);
                }
            }

            function plural(n) {
                if (n === 1) return "бросок";
                if (n >= 2 && n <= 4) return "броска";
                return "бросков";
            }

            function renderHistory() {
                if (state.history.length === 0) {
                    historyEmpty.style.display = "";
                    var rows = historyBody.querySelectorAll(".hrow");
                    for (var i = 0; i < rows.length; i++) rows[i].remove();
                    historySub.textContent = "пока пусто";
                    btnClear.style.display = "none";
                    return;
                }
                historyEmpty.style.display = "none";
                btnClear.style.display = "";
                historySub.textContent = state.history.length + " " + plural(state.history.length);

                var existing = historyBody.querySelectorAll(".hrow");
                for (var i = 0; i < existing.length; i++) existing[i].remove();

                for (var j = 0; j < state.history.length; j++) {
                    var item = state.history[j];
                    var row = document.createElement("div");
                    row.className = "hrow fade-in-up";
                    var chips = '';
                    for (var k = 0; k < item.values.length; k++) {
                        chips += '<span class="chip">' + item.values[k] + '</span>';
                    }
                    row.innerHTML =
                        '<div class="hrow-left">' +
                        '<div class="chip-row">' + chips + '</div>' +
                        '<span class="hrow-meta">#' + item.id + ' · ' + item.timestamp + '</span>' +
                        '</div>' +
                        '<div class="hrow-sum">Σ ' + item.total + '</div>';
                    historyBody.appendChild(row);
                }
            }

            // ── Actions ───────────────────────────────────────────────────
            function roll() {
                if (state.rolling) return;
                var finalValues = [];
                for (var i = 0; i < state.count; i++) {
                    finalValues.push(1 + Math.floor(Math.random() * 6));
                }
                state.dice = finalValues;
                state.rolling = true;
                btnRoll.disabled = true;
                btnRoll.classList.add("rolling");
                btnSnapshot.disabled = true;
                btnRollText.textContent = "Летят…";
                rollIcon.classList.add("spin-icon");
                rollIcon.classList.remove("hover-rotate");

                // haptic
                var tg = window._tg;
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");

                renderDice();

                window.setTimeout(function() {
                    state.rolling = false;
                    btnRoll.disabled = false;
                    btnSnapshot.disabled = false;
                    btnRoll.classList.remove("rolling");
                    btnRollText.textContent = "Бросить";
                    rollIcon.classList.remove("spin-icon");
                    rollIcon.classList.add("hover-rotate");

                    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
                    if (tg) tg.sendData(JSON.stringify({ action: "roll", values: finalValues }));

                    var total = finalValues.reduce(function(a, b) { return a + b; }, 0);
                    var now = new Date();
                    var ts = now.toLocaleTimeString("ru-RU", {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                    });
                    state.counter += 1;
                    state.history.unshift({
                        id: state.counter,
                        timestamp: ts,
                        values: finalValues,
                        total: total,
                    });
                    if (state.history.length > 50) state.history.length = 50;

                    renderDice();
                    renderHistory();
                }, ROLL_DURATION);
            }

            function changeCount(n) {
                if (state.rolling || n === state.count) return;
                var tg = window._tg;
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

                state.count = n;
                if (state.dice.length < n) {
                    var add = [];
                    for (var i = 0; i < n - state.dice.length; i++) {
                        add.push(1 + Math.floor(Math.random() * 6));
                    }
                    state.dice = state.dice.concat(add);
                } else if (state.dice.length > n) {
                    state.dice = state.dice.slice(0, n);
                }
                renderSeg();
                renderDice();
            }

            function clearHistory() {
                var tg = window._tg;
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
                state.history = [];
                renderHistory();
            }

            function showToast(msg) {
                toastBox.textContent = msg;
                toastEl.style.display = "";
                toastBox.style.animation = "none";
                void toastBox.offsetWidth;
                toastBox.style.animation = "";
                window.setTimeout(function() { toastEl.style.display = "none"; }, 2200);
            }

            // ── Snapshot Logic (Modal Approach) ───────────────────────────
            function drawToCanvas() {
                var size = dieSize();
                var gap = 40;
                var padding = 60;
                var n = state.dice.length;
                var W = padding * 2 + n * size + (n - 1) * gap;
                var H = 260;
                var DPR = 2;

                var canvas = document.createElement("canvas");
                canvas.width = W * DPR;
                canvas.height = H * DPR;
                var ctx = canvas.getContext("2d");
                ctx.scale(DPR, DPR);

                // Background
                var grad = ctx.createLinearGradient(0, 0, W, H);
                grad.addColorStop(0, "#faf6ef");
                grad.addColorStop(1, "#faf6ef");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Soft blobs
                var r1 = ctx.createRadialGradient(80, 40, 0, 80, 40, 80);
                r1.addColorStop(0, "rgba(124,106,209,0.08)");
                r1.addColorStop(1, "rgba(124,106,209,0)");
                ctx.fillStyle = r1;
                ctx.fillRect(0, 0, W, H);
                var r2 = ctx.createRadialGradient(W - 80, H - 40, 0, W - 80, H - 40, 100);
                r2.addColorStop(0, "rgba(210,170,120,0.1)");
                r2.addColorStop(1, "rgba(210,170,120,0)");
                ctx.fillStyle = r2;
                ctx.fillRect(0, 0, W, H);

                // Field card
                ctx.save();
                ctx.shadowColor = "rgba(91,75,176,0.15)";
                ctx.shadowBlur = 40;
                ctx.shadowOffsetY = 10;
                ctx.fillStyle = "rgba(255,255,255,0.8)";
                roundRect(ctx, 20, 20, W - 40, H - 40, 24);
                ctx.fill();
                ctx.restore();

                // Dice
                var totalY = (H - size) / 2;
                for (var i = 0; i < n; i++) {
                    var x = padding + i * (size + gap);
                    drawDieFace(ctx, x, totalY, size, state.dice[i]);
                }

                // Sum badge
                var total = state.dice.reduce(function(a, b) { return a + b; }, 0);
                ctx.save();
                ctx.font = "600 11px Inter, sans-serif";
                ctx.fillStyle = "#6b6680";
                var txt = "Σ " + total;
                var tw = ctx.measureText(txt).width;
                var bx = W - 40 - tw - 16;
                var by = 36;
                ctx.fillStyle = "rgba(255,255,255,0.9)";
                roundRect(ctx, bx, by, tw + 16, 22, 11);
                ctx.fill();
                ctx.strokeStyle = "#e8dfd1";
                ctx.stroke();
                ctx.fillStyle = "#6b6680";
                ctx.textBaseline = "middle";
                ctx.fillText("Σ ", bx + 8, by + 11);
                ctx.fillStyle = "#2d2a44";
                ctx.font = "600 11px Inter, sans-serif";
                ctx.fillText(total, bx + 8 + ctx.measureText("Σ ").width, by + 11);
                ctx.restore();

                return canvas;
            }

            function roundRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function drawDieFace(ctx, x, y, size, value) {
                // Shadow
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(x + size / 2, y + size + size * 0.06, size * 0.275, size * 0.035, 0, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(45,42,68,0.15)";
                ctx.fill();
                ctx.restore();

                // Face rounded rect
                ctx.save();
                ctx.shadowColor = "rgba(79,70,229,0.15)";
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 10;
                var g = ctx.createLinearGradient(x, y, x + size, y + size);
                g.addColorStop(0, "#fffdf7");
                g.addColorStop(1, "#f5f0e6");
                ctx.fillStyle = g;
                ctx.strokeStyle = "#ddd5c4";
                ctx.lineWidth = 1.5;
                var r = size * 0.16;
                roundRect(ctx, x, y, size, size, r);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // Dots
                var pad = size * 0.16;
                var inner = size - pad * 2;
                var cell = inner / 3;
                var active = DOT_MAP[value] || DOT_MAP[1];
                var dotR = cell * 0.39;
                for (var i = 0; i < 9; i++) {
                    if (!active.includes(i)) continue;
                    var row = Math.floor(i / 3);
                    var col = i % 3;
                    var cx = x + pad + cell * col + cell / 2;
                    var cy = y + pad + cell * row + cell / 2;
                    ctx.beginPath();
                    ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
                    var dg = ctx.createRadialGradient(cx - dotR * 0.25, cy - dotR * 0.25, 0, cx, cy, dotR);
                    dg.addColorStop(0, "#443f5c");
                    dg.addColorStop(1, "#2d2a44");
                    ctx.fillStyle = dg;
                    ctx.fill();
                }
            }

            function takeSnapshot() {
                if (state.snapshotBusy || state.rolling) return;

                } finally {

            modal.addEventListener('click', function(e) {

            // ── Events ────────────────────────────────────────────────────
            var segBtns = segEl.querySelectorAll("button");
            for (var i = 0; i < segBtns.length; i++) {

            renderHistory();

            "#67E8F9", "#93C5FD", "#C4B5FD", "#F0ABFC",
            "#F9A8D4", "#A7F3D0", "#BAE6FD", "#DDD6FE",
            "#FECACA", "#FED7AA", "#D9F99D", "#BFDBFE"

        const CANVAS_SIZE = 420;
        const OUTER_RADIUS = 190;
        const INNER_RADIUS = 40;

        function getColorForIndex(index) {
            return WHEEL_COLORS[index % WHEEL_COLORS.length];
        }

        function generateId() {
            return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substr(2, 9);
        }

        function useTelegramMiniApp() {
            const tgRef = useRef(null);

            useEffect(() => {
                if (window.Telegram?.WebApp) {
                    const tg = window.Telegram.WebApp;

        }

        function loadItems(key) {
            try {
                const saved = localStorage.getItem(key);
                const parsed = saved ? JSON.parse(saved) : [];
                if (!Array.isArray(parsed)) return [];
                return parsed
                    .map((item, index) => ({
                        id: typeof item.id === "string" ? item.id : generateId(),
                        label: typeof item.label === "string" ? item.label : "",
                        color: getColorForIndex(index),
                    }))
                    .filter(item => item.label.trim().length > 0);
            } catch {
                return [];
            }
        }

        // SpinWheel с возможностью внешнего управления
        const SpinWheel = forwardRef(function SpinWheel({ items, onSpinEnd, disabled, externalControl }, ref) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isSpinning, setIsSpinning] = useState(false);
            const rotationRef = useRef(0);
            const animFrameRef = useRef(0);

            const drawWheel = useCallback((rotation) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;

                ctx.clearRect(0, 0, w, h);
                if (items.length === 0) return;

                const arcSize = (2 * Math.PI) / items.length;

                ctx.save();
                ctx.shadowColor = "rgba(124,58,237,0.16)";
                ctx.shadowBlur = 24;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;

                items.forEach((item, i) => {
                    const startAngle = rotation + i * arcSize - Math.PI / 2;
                    const endAngle = startAngle + arcSize;

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, OUTER_RADIUS, startAngle, endAngle);
                    ctx.closePath();

                    ctx.fillStyle = item.color;
                    ctx.fill();

                    ctx.strokeStyle = "rgba(255,255,255,0.65)";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

                ctx.restore();

                ctx.beginPath();
                ctx.arc(cx, cy, INNER_RADIUS, 0, 2 * Math.PI);
                ctx.fillStyle = "rgba(255,255,255,0.72)";
                ctx.fill();

                ctx.save();
                const fontSize = Math.min(14, Math.max(9, 160 / items.length));
                ctx.font = `bold ${fontSize}px Inter, -apple-system, BlinkMacSystemFont, sans-serif`;
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";

                items.forEach((item, i) => {
                    const midAngle = rotation + (i + 0.5) * arcSize - Math.PI / 2;
                    const innerPadding = 34;
                    const labelRadius = INNER_RADIUS + innerPadding;

                    ctx.save();
                    ctx.translate(cx + Math.cos(midAngle) * labelRadius, cy + Math.sin(midAngle) * labelRadius);
                    ctx.rotate(midAngle);

                    ctx.shadowColor = "rgba(255,255,255,0.8)";
                    ctx.shadowBlur = 4;
                    ctx.fillStyle = "#475569";

                    let displayLabel = item.label;
                    const maxWidth = OUTER_RADIUS - labelRadius - 15;
                    if (ctx.measureText(displayLabel).width > maxWidth) {
                        while (ctx.measureText(displayLabel + "...").width > maxWidth && displayLabel.length > 0) {
                            displayLabel = displayLabel.slice(0, -1);
                        }
                        displayLabel += "...";
                    }

                    ctx.fillText(displayLabel, 0, 0);
                    ctx.restore();
                });

                ctx.restore();

                ctx.beginPath();
                ctx.arc(cx, cy, OUTER_RADIUS + 4, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.lineWidth = 3;
                ctx.stroke();

            useEffect(() => {
                drawWheel(rotationRef.current);
            }, [items, drawWheel]);

            useEffect(() => {
                const updateSize = () => {
                    const container = containerRef.current;
                    const canvas = canvasRef.current;
                    if (!container || !canvas) return;

                    const containerWidth = container.clientWidth;
                    const maxSize = Math.min(containerWidth - 32, CANVAS_SIZE);

                    canvas.style.width = `${maxSize}px`;
                    canvas.style.height = `${maxSize}px`;

                    drawWheel(rotationRef.current);
                };

                updateSize();
                window.addEventListener("resize", updateSize);
                return () => window.removeEventListener("resize", updateSize);
            }, [drawWheel]);

            const getWinnerIndex = useCallback((rotation) => {
                if (items.length === 0) return -1;
                const arcSize = (2 * Math.PI) / items.length;
                const normalizedRotation = ((rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const position = Math.ceil(normalizedRotation / arcSize);
                return (items.length - position) % items.length;
            }, [items.length]);

                if (isSpinning || disabled || items.length < 2) return;

                setIsSpinning(true);

                const targetSegment = Math.floor(Math.random() * items.length);
                const arcSize = (2 * Math.PI) / items.length;
                const targetRotation = -(targetSegment + 0.5) * arcSize;
                const extraRotations = 5 + Math.floor(Math.random() * 6);
                const finalRotation = rotationRef.current + extraRotations * 2 * Math.PI + (targetRotation - (rotationRef.current % (2 * Math.PI)));

                const startRotation = rotationRef.current;
                const totalRotation = finalRotation - startRotation;
                const duration = 4000 + Math.random() * 1000;
                const startTime = performance.now();

                const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easedProgress = easeOutCubic(progress);

                    rotationRef.current = startRotation + totalRotation * easedProgress;
                    drawWheel(rotationRef.current);

                    if (progress < 1) {
                        animFrameRef.current = requestAnimationFrame(animate);
                    } else {
                        rotationRef.current = finalRotation;
                        drawWheel(finalRotation);
                        setIsSpinning(false);

                        const winnerIndex = getWinnerIndex(finalRotation);
                        const winner = items[winnerIndex];
                        if (onSpinEnd) onSpinEnd(winner);
                    }
                };

                animFrameRef.current = requestAnimationFrame(animate);
            }, [isSpinning, disabled, items, drawWheel, onSpinEnd, getWinnerIndex]);

            useImperativeHandle(ref, () => ({

                return () => {
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);

                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {

                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }

                            ]),

                            }, doubleHistory.slice(0, 10).map((h, i) =>
                                React.createElement('span', {

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // Компонент игры "Камень Ножницы Бумага"
        function RPSApp() {
            const [playerMove, setPlayerMove] = useState(null); // 'rock', 'paper', 'scissors'
            const [aiMove, setAiMove] = useState(null);
            const [result, setResult] = useState(null); // 'win', 'lose', 'draw'
            const [history, setHistory] = useState([]); // массив объектов {player, ai, result}
            const [isPlaying, setIsPlaying] = useState(false);
            const [score, setScore] = useState({ player: 0, ai: 0 });
            const [gameOver, setGameOver] = useState(false);
            const timerRef = useRef(null);

            // Символы для отображения
            const moveEmoji = {
                rock: '✊',
                paper: '✋',
                scissors: '✌️'
            };
            const moveLabel = {
                rock: 'Камень',
                paper: 'Бумага',
                scissors: 'Ножницы'
            };

            // Определение победителя
            const getResult = (player, ai) => {
                if (player === ai) return 'draw';
                if (
                    (player === 'rock' && ai === 'scissors') ||
                    (player === 'scissors' && ai === 'paper') ||
                    (player === 'paper' && ai === 'rock')
                ) {
                    return 'win';
                }
                return 'lose';
            };

            // Стратегия ИИ: анализ паттернов игрока (без подсматривания)
            const aiStrategy = (playerHistory) => {
                if (playerHistory.length === 0) {
                    // Если история пуста, случайный выбор
                    const moves = ['rock', 'paper', 'scissors'];
                    return moves[Math.floor(Math.random() * moves.length)];
                }

                // Считаем частоты ходов игрока за всю историю
                const counts = { rock: 0, paper: 0, scissors: 0 };
                playerHistory.forEach(move => {
                    if (move === 'rock') counts.rock++;
                    else if (move === 'paper') counts.paper++;
                    else if (move === 'scissors') counts.scissors++;
                });

                // Находим самый частый ход
                let maxCount = 0;
                let mostFrequent = 'rock';
                for (const [move, count] of Object.entries(counts)) {
                    if (count > maxCount) {
                        maxCount = count;
                        mostFrequent = move;
                    }
                }

                // Если все частоты равны (или история мала), случайный выбор
                if (maxCount === 0 || (counts.rock === counts.paper && counts.paper === counts.scissors)) {
                    const moves = ['rock', 'paper', 'scissors'];
                    return moves[Math.floor(Math.random() * moves.length)];
                }

                // Выбираем ход, который побеждает самый частый ход игрока
                const counterMap = {
                    rock: 'paper',   // бумага побеждает камень
                    paper: 'scissors', // ножницы побеждают бумагу
                    scissors: 'rock'    // камень побеждает ножницы
                };
                return counterMap[mostFrequent];
            };

            // Сброс ходов для нового раунда
            const resetRound = () => {
                setPlayerMove(null);
                setAiMove(null);
                setResult(null);
                setIsPlaying(false);
                if (timerRef.current) {
                    clearTimeout(timerRef.current);
                    timerRef.current = null;
                }
            };

            // Новая игра
            const newGame = () => {
                resetRound();
                setScore({ player: 0, ai: 0 });
                setHistory([]);
                setGameOver(false);
            };

            // Обработка выбора игрока
            const handlePlayerMove = (move) => {
                if (isPlaying || gameOver) return;
                setIsPlaying(true);

                // Устанавливаем ход игрока
                setPlayerMove(move);

                // ИИ выбирает ход на основе истории (без подсматривания)
                const playerHistory = history.map(h => h.player);
                const aiChoice = aiStrategy(playerHistory);
                setAiMove(aiChoice);

                // Определяем результат
                const res = getResult(move, aiChoice);
                setResult(res);

                // Обновляем счет
                setScore(prev => {
                    if (res === 'win') return { ...prev, player: prev.player + 1 };
                    if (res === 'lose') return { ...prev, ai: prev.ai + 1 };
                    return prev;
                });

                // Добавляем в историю
                setHistory(prev => [{
                    player: move,
                    ai: aiChoice,
                    result: res
                }, ...prev]);

                // Проверяем, достиг ли кто-то 3 побед
                const newScore = { ...score };
                if (res === 'win') newScore.player += 1;
                else if (res === 'lose') newScore.ai += 1;

                if (newScore.player >= 3 || newScore.ai >= 3) {
                    setGameOver(true);
                    setIsPlaying(false);
                } else {
                    // Автоматический переход к следующему раунду через 1.5 сек
                    timerRef.current = setTimeout(() => {
                        resetRound();
                    }, 1500);
                }
            };

            // Очистка таймера при размонтировании
            useEffect(() => {
                return () => {
                    if (timerRef.current) clearTimeout(timerRef.current);
                };
            }, []);

            // Подсчет статистики
            const stats = useMemo(() => {
                let wins = 0, loses = 0, draws = 0;
                history.forEach(h => {
                    if (h.result === 'win') wins++;
                    else if (h.result === 'lose') loses++;
                    else draws++;
                });
                return { wins, loses, draws };
            }, [history]);

            // Форматирование результата для отображения
            const resultText = {
                win: 'Вы выиграли! 🎉',
                lose: 'ИИ выиграл 😅',
                draw: 'Ничья 🤝'
            };

            return React.createElement('div', {
                className: 'gradient-bg min-h-screen flex flex-col relative overflow-hidden'
            }, [
                // Декоративные блобы
                React.createElement('div', {
                    key: 'blob1',
                    className: 'absolute -top-32 -right-32 w-96 h-96 rounded-full bg-violet-200/45 blur-3xl pointer-events-none'
                }),
                React.createElement('div', {
                    key: 'blob2',
                    className: 'absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-pink-200/40 blur-3xl pointer-events-none'
                }),
                React.createElement('div', {
                    key: 'blob3',
                    className: 'absolute top-1/3 left-1/4 w-64 h-64 rounded-full bg-cyan-200/35 blur-3xl pointer-events-none'
                }),

                // Шапка
                React.createElement('header', {
                    key: 'header',
                    className: 'relative z-10 glass border-b border-white/10'
                }, React.createElement('div', {
                    className: 'max-w-6xl mx-auto px-4 py-4 flex items-center justify-between'
                }, [
                    React.createElement('div', {
                        key: 'left',
                        className: 'flex items-center gap-3'
                    }, [
                        React.createElement('div', {
                            key: 'icon',
                            className: 'w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-300 to-orange-300 flex items-center justify-center shadow-lg shadow-orange-400/25 ring-1 ring-white/40'
                        }, React.createElement('svg', {
                            viewBox: '0 0 24 24',
                            fill: 'none',
                            stroke: 'currentColor',
                            strokeWidth: '1.6',
                            strokeLinejoin: 'round',
                            className: 'w-5 h-5 text-white'
                        }, React.createElement('path', {
                            d: 'M12 2L14.5 7.5L20 10l-5.5 2.5L12 18l-2.5-5.5L4 10l5.5-2.5L12 2Z',
                            fill: 'currentColor',
                            fillOpacity: '0.15'
                        }))),
                        React.createElement('div', { key: 'text' }, [
                            React.createElement('h1', {
                                className: 'text-xl font-bold text-slate-700 tracking-tight'
                            }, 'Камень Ножницы Бумага'),
                            React.createElement('p', {
                                className: 'text-xs text-slate-500'
                            }, 'поединок с ИИ')
                        ])
                    ]),
                    React.createElement('button', {
                        key: 'back',
                        onClick: () => window.showPage('home'),
                        className: 'bg-white/30 backdrop-blur rounded-full p-2 shadow-sm border border-white/40 hover:bg-white/50 transition-colors text-slate-600',
                        'aria-label': 'Назад'
                    }, React.createElement('svg', {
                        viewBox: '0 0 24 24',
                        fill: 'none',
                        stroke: 'currentColor',
                        strokeWidth: '2',
                        strokeLinecap: 'round',
                        strokeLinejoin: 'round',
                        className: 'w-5 h-5'
                    }, React.createElement('path', { d: 'M19 12H5M12 19l-7-7 7-7' })))
                ])),

                // Основное содержимое
                React.createElement('main', {
                    key: 'main',
                    className: 'relative z-10 flex-1 max-w-4xl mx-auto px-4 py-6 sm:py-10 w-full'
                }, [
                    // Счет
                    React.createElement('div', {
                        key: 'scoreboard',
                        className: 'flex justify-center gap-8 mb-4 text-sm sm:text-base font-medium text-slate-600'
                    }, [
                        React.createElement('span', null, 'Вы: ', score.player),
                        React.createElement('span', null, 'ИИ: ', score.ai),
                        React.createElement('span', null, 'До 3 побед')
                    ]),

                    // Арена
                    React.createElement('div', {
                        key: 'arena',
                        className: 'glass-strong rounded-3xl p-6 sm:p-8 mb-6'
                    }, [
                        React.createElement('div', {
                            className: 'flex items-center justify-between gap-4 sm:gap-8'
                        }, [
                            // Игрок
                            React.createElement('div', {
                                className: 'flex-1 flex flex-col items-center'
                            }, [
                                React.createElement('span', {
                                    className: 'text-xs sm:text-sm font-medium text-slate-500 mb-2'
                                }, 'Вы'),
                                React.createElement('div', {
                                    className: 'arena-card w-full flex items-center justify-center min-h-[100px] sm:min-h-[150px] text-5xl sm:text-7xl'
                                }, playerMove ? moveEmoji[playerMove] : '❓')
                            ]),
                            // Разделитель
                            React.createElement('div', {
                                className: 'flex-shrink-0 text-sm font-bold text-slate-400'
                            }, result ? resultText[result] : 'VS'),
                            // ИИ
                            React.createElement('div', {
                                className: 'flex-1 flex flex-col items-center'
                            }, [
                                React.createElement('span', {
                                    className: 'text-xs sm:text-sm font-medium text-slate-500 mb-2'
                                }, 'ИИ'),
                                React.createElement('div', {
                                    className: 'arena-card w-full flex items-center justify-center min-h-[100px] sm:min-h-[150px] text-5xl sm:text-7xl'
                                }, aiMove ? moveEmoji[aiMove] : '🤖')
                            ])
                        ])
                    ]),

                    // Карты выбора
                    React.createElement('div', {
                        key: 'choices',
                        className: 'flex justify-center gap-4 sm:gap-6 mb-6'
                    }, ['rock', 'paper', 'scissors'].map(move =>
                        React.createElement('button', {
                            key: move,
                            onClick: () => handlePlayerMove(move),
                            disabled: isPlaying || !!playerMove || gameOver,
                            className: `rps-card flex flex-col items-center justify-center p-4 sm:p-6 w-20 sm:w-28 transition-all
                                       ${playerMove === move ? 'selected' : ''}
                                       ${isPlaying || playerMove || gameOver ? 'opacity-50 cursor-not-allowed' : ''}`
                        }, [
                            React.createElement('span', {
                                className: 'text-3xl sm:text-5xl'
                            }, moveEmoji[move]),
                            React.createElement('span', {
                                className: 'text-xs sm:text-sm mt-1 text-slate-600'
                            }, moveLabel[move])
                        ])
                    )),

                    // Сообщение о завершении игры и кнопка "Новая игра"
                    gameOver && React.createElement('div', {
                        key: 'gameover',
                        className: 'text-center mb-6'
                    }, [
                        React.createElement('p', {
                            className: 'text-lg font-bold text-slate-700 mb-2'
                        }, score.player >= 3 ? '🎉 Вы победили в игре!' : '😅 ИИ победил в игре!'),
                        React.createElement('button', {
                            onClick: newGame,
                            className: 'px-6 py-2 rounded-full bg-gradient-to-r from-violet-400 to-sky-400 hover:from-violet-300 hover:to-sky-300 text-white font-medium text-sm shadow-lg shadow-violet-400/25 transition-all active:scale-95'
                        }, 'Новая игра')
                    ]),

                    // Статистика и история
                    React.createElement('div', {
                        key: 'stats',
                        className: 'glass rounded-2xl p-4 sm:p-6'
                    }, [
                        React.createElement('div', {
                            className: 'flex justify-between items-center mb-3 sm:mb-4'
                        }, [
                            React.createElement('h3', {
                                className: 'text-sm font-bold text-slate-600'
                            }, 'Статистика'),
                            React.createElement('div', {
                                className: 'flex gap-3 text-xs sm:text-sm text-slate-500'
                            }, [
                                React.createElement('span', null, '🏆 ', stats.wins),
                                React.createElement('span', null, '😅 ', stats.loses),
                                React.createElement('span', null, '🤝 ', stats.draws)
                            ])
                        ]),
                        React.createElement('div', {
                            className: 'flex justify-between items-center mb-2'
                        }, [
                            React.createElement('h3', {
                                className: 'text-sm font-bold text-slate-600'
                            }, 'История матчей'),
                            history.length > 0 && React.createElement('button', {
                                onClick: () => setHistory([]),
                                className: 'text-xs text-slate-400 hover:text-red-400 transition-colors'
                            }, 'Очистить')
                        ]),
                        React.createElement('div', {
                            className: 'max-h-40 sm:max-h-60 overflow-y-auto space-y-1'
                        }, history.length === 0 ?
                            React.createElement('p', {
                                className: 'text-center text-slate-400 text-xs py-4'
                            }, 'Сыграйте первый матч!') :
                            history.map((h, idx) =>
                                React.createElement('div', {
                                    key: idx,
                                    className: 'flex items-center justify-between px-2 py-1 rounded bg-white/30 text-xs sm:text-sm'
                                }, [
                                    React.createElement('span', {
                                        className: 'text-slate-600'
                                    }, `${moveEmoji[h.player]} vs ${moveEmoji[h.ai]}`),
                                    React.createElement('span', {
                                        className: h.result === 'win' ? 'text-green-500' :
                                            h.result === 'lose' ? 'text-red-400' : 'text-slate-400'
                                    }, h.result === 'win' ? 'Вы' : h.result === 'lose' ? 'ИИ' : 'Ничья')
                                ])
                            )
                        )
                    ])
                ]),

                // Футер
                React.createElement('footer', {
                    key: 'footer',
                    className: 'relative z-10 glass border-t border-white/10 py-4 mt-auto'
                }, React.createElement('div', {
                    className: 'max-w-6xl mx-auto px-4 text-center text-slate-500/70 text-xs'
                }, `© ${new Date().getFullYear()} Created Disa.`))
            ]);
        }
    </script>
